<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diagnostics · Anesthesia Mock Exam</title>
    <style>
      body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #0b1220; color: #e8eef7; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
      h1 { font-size: 1.4rem; }
      .row { display: grid; grid-template-columns: 220px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid #26334d; }
      .k { color: #94a3b8; font-weight: 600; }
      .v { font-family: ui-monospace, Consolas, monospace; word-break: break-word; }
      .ok { color: #4ade80; }
      .bad { color: #f87171; }
      .warn { color: #fbbf24; }
      .box { margin-top: 20px; padding: 16px; border: 1px solid #26334d; border-radius: 12px; background: #131c2e; }
      a { color: #5eead4; }
      code { background: #1f2b44; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Anesthesia Mock Exam — Diagnostics</h1>
      <p style="color:#94a3b8">This page checks whether your browser can run the app and reach the server. Send the results if the main app still hangs.</p>
      <div id="out"></div>
      <div class="box">
        Back to the app: <a href="/">http://localhost:3000/</a>
      </div>
    </div>
    <script>
      (function () {
        var out = document.getElementById("out");
        function row(key, value, cls) {
          var d = document.createElement("div");
          d.className = "row";
          var k = document.createElement("div");
          k.className = "k";
          k.textContent = key;
          var v = document.createElement("div");
          v.className = "v " + (cls || "");
          v.textContent = value;
          d.appendChild(k);
          d.appendChild(v);
          out.appendChild(d);
        }

        row("URL", location.href);
        row("User agent", navigator.userAgent);
        row("Online", navigator.onLine ? "yes" : "no", navigator.onLine ? "ok" : "bad");

        var moduleSupport = false;
        try {
          moduleSupport = !!HTMLScriptElement.supports && HTMLScriptElement.supports("module");
        } catch (e) {}
        row("ES module support", moduleSupport ? "yes" : "NO", moduleSupport ? "ok" : "bad");

        var ls = "ok";
        try {
          localStorage.setItem("__diag", "1");
          localStorage.removeItem("__diag");
        } catch (e) {
          ls = "blocked (" + e.name + ")";
        }
        row("localStorage", ls, ls === "ok" ? "ok" : "warn");

        var fetchSupport = typeof fetch === "function";
        row("fetch() support", fetchSupport ? "yes" : "NO", fetchSupport ? "ok" : "bad");

        function get(path) {
          return new Promise(function (resolve) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", path, true);
            xhr.onreadystatechange = function () {
              if (xhr.readyState === 4) {
                resolve({ status: xhr.status, len: (xhr.responseText || "").length });
              }
            };
            xhr.onerror = function () { resolve({ status: "network error", len: 0 }); };
            try { xhr.send(); } catch (e) { resolve({ status: "send error: " + e.message, len: 0 }); }
          });
        }

        get("/api/health").then(function (r) {
          var good = r.status === 200 && r.len > 0;
          row("GET /api/health", r.status + " (" + r.len + " bytes)", good ? "ok" : "bad");
        });
        get("/js/utils.js").then(function (r) {
          var good = r.status === 200 && r.len > 0;
          row("GET /js/utils.js", r.status + " (" + r.len + " bytes)", good ? "ok" : "bad");
        });
        get("/js/app.js").then(function (r) {
          var good = r.status === 200 && r.len > 0;
          row("GET /js/app.js", r.status + " (" + r.len + " bytes)", good ? "ok" : "bad");
        });

        // Actually try to load an ES module (no side effects).
        if (moduleSupport) {
          import("/js/utils.js")
            .then(function (m) {
              row("dynamic import module", "worked (esc: " + typeof m.esc + ")", "ok");
            })
            .catch(function (e) {
              row("dynamic import module", "FAILED: " + e.message, "bad");
            });
        } else {
          row("dynamic import module", "skipped (no module support)", "bad");
        }
      })();
    </script>
  </body>
</html>
